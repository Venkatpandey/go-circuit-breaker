name: release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (example: v1.0.0 or v1.0.0-rc.1)"
        required: true
        type: string
      target:
        description: "Target branch for the release tag"
        required: true
        default: "main"
        type: string
      prerelease:
        description: "Mark release as prerelease"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go-version:
          - "1.25.x"
          - "1.24.x"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target }}
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          check-latest: true

      - name: Go version
        run: go version

      - name: Validate tag format
        if: matrix.go-version == '1.25.x'
        run: |
          echo "${{ inputs.tag }}" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$'

      - name: Validate release checks
        run: |
          go test ./...
          go test -race ./...
          go test -tags=integration ./adapters
          go vet ./...
          go run honnef.co/go/tools/cmd/staticcheck@latest ./...
          go run golang.org/x/vuln/cmd/govulncheck@latest ./...
          go build ./cmd/http-demo
          go test -run=^$ -bench=. -benchmem ./core ./service

  publish:
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target }}
          fetch-depth: 0

      - name: Create and push git tag
        run: |
          if git rev-parse "${{ inputs.tag }}" >/dev/null 2>&1; then
            echo "Tag ${{ inputs.tag }} already exists."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "${{ inputs.tag }}"
          git push origin "${{ inputs.tag }}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          generate_release_notes: true
          prerelease: ${{ inputs.prerelease }}
